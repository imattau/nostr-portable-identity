[package]
name = "nostr-portable-signer-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nostr = "0.44"
nostr-portable-crypto = { path = "../crypto" }
nostr-portable-vault = { path = "../vault" }
nostr-portable-permissions = { path = "../permissions" }
nostr-portable-protocol = { path = "../protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
