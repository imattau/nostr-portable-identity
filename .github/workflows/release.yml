name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  extensions-chromium:
    name: Extension (Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: (cd extensions/chromium && zip -r ../../chromium-extension.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: chromium-extension
          path: chromium-extension.zip

  extensions-firefox:
    name: Extension (Firefox)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: (cd extensions/firefox && zip -r ../../firefox-extension.zip .)
      - uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: firefox-extension.zip

  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tauri/desktop/src-tauri
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libxdo-dev libssl-dev \
            dpkg-dev fakeroot
      - run: |
          mkdir -p apps/tauri/desktop/dist
          echo '<!doctype html><html><body></body></html>' > apps/tauri/desktop/dist/index.html
      - run: cargo build --release --workspace
        env:
          CARGO_TERM_COLOR: always
      - run: cargo test --release --workspace
        env:
          CARGO_TERM_COLOR: always
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.os }}
          path: |
            target/release/nostr-portable-cli${{ matrix.os == 'windows-2022' && '.exe' || '' }}
            target/release/nostr-portable-nm-host${{ matrix.os == 'windows-2022' && '.exe' || '' }}

  tauri-linux:
    name: Tauri desktop (Linux)
    runs-on: ubuntu-24.04
    needs: rust-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tauri/desktop/src-tauri
      - run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libxdo-dev libssl-dev \
            dpkg-dev fakeroot
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/tauri/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/tauri/desktop
      - run: npm run tauri build
        working-directory: apps/tauri/desktop
        env:
          CARGO_TERM_COLOR: always
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-linux
          path: |
            apps/tauri/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/tauri/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/tauri/desktop/src-tauri/target/release/nostr-portable-desktop

  tauri-windows:
    name: Tauri desktop (Windows)
    runs-on: windows-2022
    needs: rust-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tauri/desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/tauri/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/tauri/desktop
      - run: npm run tauri build
        working-directory: apps/tauri/desktop
        env:
          CARGO_TERM_COLOR: always
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-windows
          path: |
            apps/tauri/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/tauri/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/tauri/desktop/src-tauri/target/release/nostr-portable-desktop.exe

  tauri-android:
    name: Tauri Android (APK)
    runs-on: ubuntu-24.04
    needs: rust-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tauri/desktop/src-tauri
      - run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libxdo-dev libssl-dev
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/tauri/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/tauri/desktop
      - run: npx tauri android init --ci 2>/dev/null || npx tauri android init
        working-directory: apps/tauri/desktop
      - run: npx tauri android build --debug
        working-directory: apps/tauri/desktop
        env:
          CARGO_TERM_COLOR: always
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-android
          path: apps/tauri/desktop/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  tauri-linux-flatpak:
    name: Tauri desktop (Flatpak)
    runs-on: ubuntu-24.04
    needs: rust-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tauri/desktop/src-tauri
      - run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev \
            libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libxdo-dev libssl-dev \
            flatpak flatpak-builder
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/tauri/desktop/package-lock.json
      - run: npm ci
        working-directory: apps/tauri/desktop
      - run: npm run tauri build
        working-directory: apps/tauri/desktop
        env:
          CARGO_TERM_COLOR: always
      - name: Add Flathub remote
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo
      - name: Install GNOME SDK
        run: |
          flatpak install --user --assumeyes flathub org.gnome.Sdk/x86_64/50
      - name: Build Flatpak
        run: |
          flatpak-builder --user --force-clean \
            --repo=flatpak-repo \
            flatpak-build \
            build-aux/flatpak/com.nostr.portable.identity.yml
          flatpak build-bundle \
            flatpak-repo \
            nostr-portable-identity.flatpak \
            com.nostr.portable.identity
      - uses: actions/upload-artifact@v4
        with:
          name: tauri-linux-flatpak
          path: nostr-portable-identity.flatpak

  publish:
    name: Create GitHub Release
    needs: [extensions-chromium, extensions-firefox, rust-workspace, tauri-linux, tauri-linux-flatpak, tauri-windows, tauri-android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        run: |
          {
            echo "## Nostr Portable Identity ${{ github.ref_name }}"
            echo ""
            echo "### Packages"
            echo ""
            echo "| Platform | Package |"
            echo "|----------|---------|"
            for f in artifacts/*/*; do
              name=$(basename "$f")
              echo "- $name"
            done
          } > release-notes.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          draft: false
          prerelease: false
          files: |
            artifacts/chromium-extension/chromium-extension.zip
            artifacts/firefox-extension/firefox-extension.zip
            artifacts/tauri-linux/*.deb
            artifacts/tauri-linux/*.AppImage
            artifacts/tauri-linux/nostr-portable-desktop
            artifacts/tauri-linux-flatpak/*.flatpak
            artifacts/tauri-windows/*.msi
            artifacts/tauri-windows/*.exe
            artifacts/tauri-android/**/*.apk
            artifacts/cli-ubuntu-24.04/nostr-portable-cli
            artifacts/cli-ubuntu-24.04/nostr-portable-nm-host
            artifacts/cli-windows-2022/nostr-portable-cli.exe
            artifacts/cli-windows-2022/nostr-portable-nm-host.exe
