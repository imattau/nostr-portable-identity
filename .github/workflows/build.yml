name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'windows-2022' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tauri/desktop/src-tauri

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            dpkg-dev \
            fakeroot

      - name: Build workspace (release)
        run: cargo build --release --workspace
        env:
          CARGO_TERM_COLOR: always

      - name: Run workspace tests
        run: cargo test --release --workspace
        env:
          CARGO_TERM_COLOR: always

      - name: Upload CLI binary
        uses: actions/upload-artifact@v4
        with:
          name: nostr-portable-cli-${{ matrix.os }}
          path: |
            target/release/nostr-portable-cli${{ matrix.os == 'windows-2022' && '.exe' || '' }}
            target/release/nostr-portable-nm-host${{ matrix.os == 'windows-2022' && '.exe' || '' }}
          if-no-files-found: error

  tauri-linux:
    name: Tauri desktop (Linux)
    runs-on: ubuntu-24.04
    needs: rust-workspace

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tauri/desktop/src-tauri

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libxdo-dev \
            libssl-dev \
            dpkg-dev \
            fakeroot

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/tauri/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/tauri/desktop
        run: npm ci

      - name: Build Tauri desktop app
        working-directory: apps/tauri/desktop
        run: npm run tauri build
        env:
          CARGO_TERM_COLOR: always

      - name: Upload Linux bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-linux
          path: |
            apps/tauri/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/tauri/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/tauri/desktop/src-tauri/target/release/nostr-portable-desktop
          if-no-files-found: warn

  tauri-windows:
    name: Tauri desktop (Windows)
    runs-on: windows-2022
    needs: rust-workspace

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            apps/tauri/desktop/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/tauri/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/tauri/desktop
        run: npm ci

      - name: Build Tauri desktop app
        working-directory: apps/tauri/desktop
        run: npm run tauri build
        env:
          CARGO_TERM_COLOR: always

      - name: Upload Windows bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-desktop-windows
          path: |
            apps/tauri/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/tauri/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/tauri/desktop/src-tauri/target/release/nostr-portable-desktop.exe
          if-no-files-found: warn
