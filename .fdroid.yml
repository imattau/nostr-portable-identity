WebSite: https://github.com/anomalyco/nostr-portable-identity
SourceCode: https://github.com/anomalyco/nostr-portable-identity
IssueTracker: https://github.com/anomalyco/nostr-portable-identity/issues
Changelog: https://github.com/anomalyco/nostr-portable-identity/releases

AutoName: Nostr Portable Identity
Summary: Nostr identity manager with cross-device signing
Description: |-
  A portable identity manager for the Nostr protocol. It acts as a
  NIP-46 signer backend and a NIP-55 Android signer target,
  allowing you to manage your Nostr keys across devices.

  Features:
  * NIP-46 remote signing via WebSocket/IPC
  * NIP-55 Android native signing via Intents
  * Biometric authentication for signing operations
  * USB/OTG vault storage (encrypted JSON on USB drives)
  * Browser extension support via native messaging
  * Multiple vault profiles

RepoType: git
Repo: https://github.com/anomalyco/nostr-portable-identity

Builds:
  - versionName: 0.1.3
    versionCode: 3
    commit: v0.1.3
    subdir: apps/tauri/desktop
    sudo:
      - apt-get update
      - apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
        libappindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev
        libsoup-3.0-dev libxdo-dev libssl-dev
    init:
      - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
    output: src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk
    build:
      - npm ci
      - npx tauri android init --ci
      - npx tauri android build
    scanignore:
      - src-tauri/gen/android
    ndk: 29.0.13846066

# Auto-update is manual for now since versionCode is not in the repo
# (the Android project is generated by tauri android init at build time).
# Once the Android project is committed, Tags mode can be enabled.
AutoUpdateMode: None
UpdateCheckMode: Static
CurrentVersion: 0.1.3
CurrentVersionCode: 3
